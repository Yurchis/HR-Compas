[project]
name = "hr-compass"
version = "0.2.0"
description = "HR assistant that answers employees' questions from company documents (RAG; AI Engineer course project)"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "truststore>=0.9",       # OS trust store: corporate TLS-inspecting proxies work
    "pydantic>=2.6",
    "pypdf>=5.0",            # ingestion: PDF text
    "beautifulsoup4>=4.12",  # ingestion: HTML -> markdown
    "python-docx>=1.1",      # ingestion: DOCX -> markdown
    "tiktoken>=0.7",         # token counts (chunk sizes, prompt budget)
    "fastembed>=0.5",        # local embedding model and cross-encoder (ONNX, CPU)
    "qdrant-client>=1.12",   # vector index (in memory) with the access filter
    "rank-bm25>=0.2.2",      # keyword search for the hybrid search
    "numpy>=1.26",           # semantic near-duplicates
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
hr-compass = "hr_compass.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hr_compass*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]   # Cyrillic and typographic characters in strings and comments are content
