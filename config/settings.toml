# Усі налаштування клієнта OpenRouter. Секрет (OPENROUTER_API_KEY) — лише в .env.
# Невідомий ключ або некоректне значення = помилка запуску.

[openrouter]
base_url = "https://openrouter.ai/api/v1"
model = "openai/gpt-4o-mini"        # основна модель
concurrency = 4                      # паралельних запитів
app_url = ""                         # необов'язково: HTTP-Referer для рейтингів OpenRouter
app_title = "HR Compass"

# Псевдоніми моделей для `--model` / `--models`. Slug береться з https://openrouter.ai/models
[models]
gpt4omini = "openai/gpt-4o-mini"          # 128k ctx, провайдери Azure/OpenAI, підтримує structured_outputs
haiku = "anthropic/claude-haiku-5.5"
deepseek = "deepseek/deepseek-v4.1-flash"
luna = "openai/gpt-6-luna"                # у каталозі також gpt-6-luna-pro, gpt-5.6-luna (звірено 2026-10-27)
nemotron = "nvidia/nemotron-3.5-super-vl:free"   # чат-модель NVIDIA, безкоштовна (не плутати з reranker-ом у [rerank])

# Параметри семплінгу (однакові для intake і відповіді). Для відтворюваної оцінки — temperature = 0.
# Ціни для звіту: slug -> [вхід, вихід] у $ за 1M токенів (https://openrouter.ai/models).
# Фактична вартість прогону береться з usage.cost відповіді OpenRouter; ці ціни лише для таблиці порівняння.
# Ключ у лапках, бо slug містить "/". Немає ціни — у таблиці "—".
[pricing]
"openai/gpt-4o-mini" = [0.15, 0.60]   # звірено 2026-10-31: 26554 вх. + 45 вих. = $0.0040101, як у usage.cost
"anthropic/claude-haiku-5.5" = [0.10, 0.50]    # звірено 2026-11-01 з https://openrouter.ai/api/v1/models
"anthropic/claude-sonnet-5.5" = [2.00, 10.00]  # звірено 2026-11-01 з https://openrouter.ai/api/v1/models
"nvidia/llama-nemotron-rerank-vl-1b-v2:free" = [0.0, 0.0]
"nvidia/nemotron-3.5-super-vl:free" = [0.0, 0.0]

[generation]
temperature = 0.0                    # [0, 2]: 0 — детерміновано, більше — різноманітніше
top_p = 1.0                          # (0, 1]: nucleus sampling; 1.0 — вимкнено. Зазвичай змінюють або це, або temperature
max_tokens = 1024

# Pattern 1: Timeout
[timeout]
connect_s = 5.0                      # встановлення з'єднання
read_s = 60.0                        # очікування байтів відповіді
write_s = 10.0
pool_s = 5.0
attempt_s = 90.0                     # жорсткий дедлайн на одну спробу (від початку до кінця)

# Pattern 2: Retry з backoff
[retry]
max_retries = 3                      # додаткових спроб після першої (2–3 для збоїв провайдера)
base_delay_s = 1.0
multiplier = 2.0                     # delay = min(max_delay_s, base_delay_s * multiplier**attempt)
max_delay_s = 30.0
jitter = true                        # full jitter: випадкова пауза в [0, delay]
respect_retry_after = true           # поважати заголовок Retry-After
retry_statuses = [408, 429, 500, 502, 503, 504]   # 400/401/403 — ніколи не повторюємо

# Pattern 3: Structured output + валідація
[structured_output]
enabled = true                       # потребує промпту, що вимагає JSON (prompts/v2_structured.md)
strict = true                        # json_schema.strict у запиті
schema_name = "hr_answer"
max_repair_attempts = 1              # скільки разів просити модель виправити невалідну відповідь

# Pattern 4: Fallback
[fallback]
enabled = true
models = ["google/gemini-2.5-flash", "anthropic/claude-haiku-4.5"]   # по черзі, якщо основна вичерпала спроби
skip_statuses = [400, 401, 402, 403] # fallback безглуздий: помилка запиту (400), ключ/доступ/оплата (401-403)

# Retrieval: reranker відбирає top_n найрелевантніших розділів хендбука під питання (ендпоінт /rerank).
# Вимкнено = full-context (весь хендбук у промпті). Вмикається тут або прапорцем --rerank.
# Якщо rerank-запит не вдався — відповідь будується з повним контекстом (деградація, не помилка).
[rerank]
enabled = false
model = "nvidia/llama-nemotron-rerank-vl-1b-v2:free"   # безкоштовна; ліміти free-моделей OpenRouter
top_n = 8                            # скільки розділів потрапляє в промпт
