# All OpenRouter client settings. The secret (OPENROUTER_API_KEY) lives only in .env.
# An unknown key or an invalid value = a startup error.

[openrouter]
base_url = "https://openrouter.ai/api/v1"
model = "openai/gpt-4o-mini"        # main model
concurrency = 4                      # parallel requests
app_url = ""                         # optional: HTTP-Referer for OpenRouter rankings
app_title = "HR Compass"

# Model aliases for `--model` / `--models`. Slugs come from https://openrouter.ai/models
[models]
gpt4omini = "openai/gpt-4o-mini"          # 128k ctx, Azure/OpenAI providers, supports structured_outputs
haiku = "anthropic/claude-haiku-5.5"
deepseek = "deepseek/deepseek-v4.1-flash"
luna = "openai/gpt-6-luna"                # the catalog also has gpt-6-luna-pro, gpt-5.6-luna (checked 2026-10-27)
nemotron = "nvidia/nemotron-3.5-super-vl:free"   # NVIDIA chat model, free (not to be confused with the reranker in [rerank])

# Sampling parameters (the same for intake and answer). For reproducible evaluation — temperature = 0.
# Prices for the report: slug -> [input, output] in $ per 1M tokens (https://openrouter.ai/models).
# The actual run cost is taken from usage.cost of the OpenRouter response; these prices are only for the comparison table.
# The key is quoted because the slug contains "/". No price — "—" in the table.
[pricing]
"openai/gpt-4o-mini" = [0.15, 0.60]   # checked 2026-10-31: 26554 in + 45 out = $0.0040101, same as usage.cost
"anthropic/claude-haiku-5.5" = [0.10, 0.50]    # checked 2026-11-01 against https://openrouter.ai/api/v1/models
"anthropic/claude-sonnet-5.5" = [2.00, 10.00]  # checked 2026-11-01 against https://openrouter.ai/api/v1/models
"deepseek/deepseek-v4.1-flash" = [0.045, 0.50] # checked 2026-11-01 against https://openrouter.ai/api/v1/models
"nvidia/llama-nemotron-rerank-vl-1b-v2:free" = [0.0, 0.0]
"nvidia/nemotron-3.5-super-vl:free" = [0.0, 0.0]

[generation]
temperature = 0.0                    # [0, 2]: 0 — deterministic, higher — more varied
top_p = 1.0                          # (0, 1]: nucleus sampling; 1.0 — off. Usually you change either this or temperature
max_tokens = 1024

# Pattern 1: Timeout
[timeout]
connect_s = 5.0                      # establishing the connection
read_s = 60.0                        # waiting for response bytes
write_s = 10.0
pool_s = 5.0
attempt_s = 90.0                     # hard deadline for one attempt (start to finish)

# Pattern 2: Retry with backoff
[retry]
max_retries = 3                      # extra attempts after the first one (2–3 for provider failures)
base_delay_s = 1.0
multiplier = 2.0                     # delay = min(max_delay_s, base_delay_s * multiplier**attempt)
max_delay_s = 30.0
jitter = true                        # full jitter: a random pause in [0, delay]
respect_retry_after = true           # honour the Retry-After header
retry_statuses = [408, 429, 500, 502, 503, 504]   # 400/401/403 — never retried

# Pattern 3: Structured output + validation
[structured_output]
enabled = true                       # needs a prompt that asks for JSON (prompts/v2_structured.md)
strict = true                        # json_schema.strict in the request
schema_name = "hr_answer"
max_repair_attempts = 1              # how many times to ask the model to fix an invalid reply

# Pattern 4: Fallback
[fallback]
enabled = true
models = ["google/gemini-2.5-flash", "anthropic/claude-haiku-4.5"]   # in turn, if the main model ran out of attempts
skip_statuses = [400, 401, 402, 403] # fallback is pointless: request error (400), key/access/payment (401-403)

# Retrieval: the reranker picks the top_n most relevant handbook sections for the question (the /rerank endpoint).
# Disabled = full context (the whole handbook in the prompt). Enable it here or with the --rerank flag.
# If the rerank request fails, the answer is built from the full context (degradation, not an error).
[rerank]
enabled = false
model = "nvidia/llama-nemotron-rerank-vl-1b-v2:free"   # free; OpenRouter free-model limits apply
top_n = 8                            # how many sections go into the prompt
