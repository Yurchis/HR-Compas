# Chunking experiment: strategy=fixed, 120 tokens. Only what differs from config/settings.toml is set here
# (the code defaults equal the shipped settings). Run:
#   hr-compass --config config/experiments/fixed-120.toml run --no-chat
#   hr-compass --config config/experiments/fixed-120.toml eval chunks
#   hr-compass --config config/experiments/fixed-120.toml eval retrieval --lenient
[ingest]
output_dir = "data/experiments/fixed-120"
strategy = "fixed"
chunk_tokens = 120

[embeddings]
cache_dir = ".cache/experiments/fixed-120"

[eval]
results_dir = "evals/results/experiments/fixed-120"

[logging]
dir = "logs/experiments/fixed-120"